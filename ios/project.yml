name: ClearNotes
options:
  bundleIdPrefix: com.clearnotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClearNotes:
    type: application
    platform: iOS
    sources:
      - ClearNotes
      - Shared
    dependencies:
      - package: FluidAudio
      # The recording's Lock Screen and Dynamic Island controls.
      - target: ClearNotesLiveActivity
      # Clear Notes on Apple Watch: records there, sends the audio here.
      - target: ClearNotesWatch
    info:
      path: ClearNotes/Info.plist
      properties:
        CFBundleDisplayName: Clear Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Clear Notes uses the microphone to transcribe your meetings on this iPhone. Recordings stay on this iPhone.
        NSCalendarsFullAccessUsageDescription: Clear Notes reads today's events so recordings take the meeting's title and invited people are suggested as speakers. Nothing is sent anywhere.
        NSSpeechRecognitionUsageDescription: Clear Notes turns speech into a written transcript on this iPhone.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # iOS 26: lets meeting processing carry on in the background (ContinuedProcessing.swift).
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).notes.*
        # Shared meetings (.clearnotes files) open in Clear Notes. Files are copied in, not edited in place.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.clearnotes.meeting
            UTTypeDescription: Clear Notes meeting
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - clearnotes
              public.mime-type:
                - application/vnd.clearnotes.meeting
        CFBundleDocumentTypes:
          - CFBundleTypeName: Clear Notes meeting
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.clearnotes.meeting
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearnotes.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ClearNotesLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Clear Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # The build workflow swaps com.clearnotes.app for your bundle ID, so this becomes <your ID>.LiveActivity.
        PRODUCT_BUNDLE_IDENTIFIER: com.clearnotes.app.LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  # Apple Watch: records voice notes, catch-ups and diary meetings on the watch and sends them
  # to the iPhone, which transcribes them and writes the notes.
  ClearNotesWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
      - path: Shared/WatchRecording.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Clear Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # The build workflow swaps com.clearnotes.app for your bundle ID here too.
        WKCompanionAppBundleIdentifier: com.clearnotes.app
        # Keeps recording when the wrist is lowered.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Clear Notes records voice notes and catch-ups on your watch. They go to your iPhone, which transcribes them there.
        CFBundleURLTypes:
          - CFBundleURLName: com.clearnotes.watch
            CFBundleURLSchemes:
              - clearnotes-watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearnotes.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Embedded in the iPhone app, not archived on its own.
        SKIP_INSTALL: YES
  # The watch-face button (WatchComplication/) is left out for now: TestFlight uploads couldn't
  # register its bundle ID automatically. To bring it back, register <your bundle ID>.watchkitapp.Complication
  # at developer.apple.com, then restore the ClearNotesWatchComplication target and the Watch
  # app's dependency on it (see git history).
  ClearNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClearNotesTests
    dependencies:
      - target: ClearNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClearNotes:
    build:
      targets:
        ClearNotes: all
        ClearNotesTests: [test]
    test:
      targets:
        - ClearNotesTests
