name: ClearNotes
options:
  bundleIdPrefix: com.clearnotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.10"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClearNotes:
    type: application
    platform: iOS
    sources:
      - ClearNotes
      - Shared
    dependencies:
      - package: FluidAudio
      # The recording's Lock Screen and Dynamic Island controls.
      - target: ClearNotesLiveActivity
    info:
      path: ClearNotes/Info.plist
      properties:
        CFBundleDisplayName: Clear Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Clear Notes uses the microphone to transcribe your meetings on this iPhone. Recordings stay on this iPhone.
        NSCalendarsFullAccessUsageDescription: Clear Notes reads today's events so recordings take the meeting's title and invited people are suggested as speakers. Nothing is sent anywhere.
        NSSpeechRecognitionUsageDescription: Clear Notes turns speech into a written transcript on this iPhone.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # iOS 26: lets meeting processing carry on in the background (ContinuedProcessing.swift).
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).notes.*
        # Shared meetings (.clearnotes files) open in Clear Notes. Files are copied in, not edited in place.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.clearnotes.meeting
            UTTypeDescription: Clear Notes meeting
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - clearnotes
              public.mime-type:
                - application/vnd.clearnotes.meeting
        CFBundleDocumentTypes:
          - CFBundleTypeName: Clear Notes meeting
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.clearnotes.meeting
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearnotes.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ClearNotesLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Clear Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # The build workflow swaps com.clearnotes.app for your bundle ID, so this becomes <your ID>.LiveActivity.
        PRODUCT_BUNDLE_IDENTIFIER: com.clearnotes.app.LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  ClearNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClearNotesTests
    dependencies:
      - target: ClearNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClearNotes:
    build:
      targets:
        ClearNotes: all
        ClearNotesTests: [test]
    test:
      targets:
        - ClearNotesTests
