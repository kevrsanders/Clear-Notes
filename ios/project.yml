name: ClearNotes
options:
  bundleIdPrefix: com.clearnotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClearNotes:
    type: application
    platform: iOS
    sources:
      - ClearNotes
    info:
      path: ClearNotes/Info.plist
      properties:
        CFBundleDisplayName: Clear Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Clear Notes uses the microphone to transcribe your meetings. Audio is never saved.
        NSSpeechRecognitionUsageDescription: Clear Notes turns speech into a written transcript on this iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearnotes.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ClearNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClearNotesTests
    dependencies:
      - target: ClearNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClearNotes:
    build:
      targets:
        ClearNotes: all
        ClearNotesTests: [test]
    test:
      targets:
        - ClearNotesTests
