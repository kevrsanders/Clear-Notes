name: iOS

# Builds and tests the iPhone app on every push that touches it. Uploads to TestFlight when
# run by hand (Actions → iOS → Run workflow) or when a pushed commit message contains
# "[testflight]". Setup: ios/TESTFLIGHT.md. Set the MACOS_RUNNER repository variable
# (e.g. macos-26-intel) to use another runner when macos-26 is short of capacity.
#
# macOS minutes count ten times towards a private repository's Actions allowance, so:
# - there is no separate pull_request run (push runs already show their checks on the PR), and
# - Markdown-only changes under ios/ don't build.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", "!ios/**/*.md", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  test:
    name: Build and test
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"]); sys.exit()
          ')
          echo "Using simulator $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project ClearNotes.xcodeproj \
            -scheme ClearNotes \
            -destination "id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarise test results
        # Not on cancelled runs: reading a half-written result bundle can hang and block the queue.
        if: success() || failure()
        timeout-minutes: 2
        run: |
          # Shows how many tests ran, since -quiet hides the per-test output.
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Tests.xcresult" --format json > "$RUNNER_TEMP/summary.json" || exit 0
          python3 - "$RUNNER_TEMP/summary.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(f"**Tests:** {s.get('passedTests', 0)} passed, {s.get('failedTests', 0)} failed, "
                f"{s.get('skippedTests', 0)} skipped (of {s.get('totalTestCount', 0)}) — {s.get('result', 'unknown')}")
          # -quiet also hides why a test failed, so list each failure with its message.
          for failure in s.get('testFailures', []):
              text = " ".join(str(failure.get('failureText', '')).split())
              print(f"- `{failure.get('testIdentifierString') or failure.get('testName', '?')}`: {text}")
          PY

  testflight:
    name: Upload to TestFlight
    needs: test
    if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]'))
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Accepted as a repository variable (preferred) or a secret.
      BUNDLE_ID: ${{ vars.CLEAR_NOTES_BUNDLE_ID || secrets.CLEAR_NOTES_BUNDLE_ID }}
    steps:
      - name: Check TestFlight settings
        working-directory: .
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID BUNDLE_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. Add them as described in ios/TESTFLIGHT.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Generate the Xcode project with your bundle ID
        run: |
          brew install xcodegen
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.clearnotes.app/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          xcodegen generate

      - name: Write the App Store Connect key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # The archive is built unsigned. Signing it here would need an Apple Development
      # certificate whose private key lives on this throwaway runner, which breaks the next
      # run. The export step below signs with Apple's cloud-managed distribution certificate.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ClearNotes.xcodeproj \
            -scheme ClearNotes \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ClearNotes.xcarchive" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -quiet \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ClearNotes.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect → TestFlight after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        working-directory: .
        run: rm -f "$KEY_PATH"
